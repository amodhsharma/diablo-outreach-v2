# Diablo outreach pipeline settings.
# Edit this file on GitHub (pencil icon) to change how the jobs behave.
# Lines starting with # are notes and are ignored.

# Research settings (companies wanted, floor, searches) live in
# skills/outreachResearch/settings.yaml, next to the skill that uses them.

contacts:
  # How many people to collect per company in one "Find contacts" run, most senior first
  # (see hierarchy below). They are emailed one at a time, most senior first (see send).
  # To go deeper after all of them got no reply, set the company back to Approved and run
  # "Find contacts" again: it reveals the next ones and never pays for the same person twice.
  per_company: 4
  # Most emails to reveal per company while trying to reach per_company verified ones.
  # Apollo charges about 1 credit per email revealed, verified or not.
  max_reveals_per_company: 5
  # Most companies to process in one run.
  companies_per_run: 25
  # Stop revealing emails once this many Apollo credits are used in one run.
  max_credits_per_run: 150
  # Only these Apollo email statuses are kept.
  keep_email_statuses: [verified]
  # Seniority order, most senior level first. Each person is placed in the level whose
  # words best match their job title (the longest matching words win, so "Assistant
  # Director" goes to level 4, not level 3). Move words between levels, or add new
  # words, to change the order. Matching ignores capital letters.
  hierarchy:
    - level: Top leadership
      words: [chief executive, ceo, managing director, founder, co-founder, owner, proprietor,
              chairman, chairperson, president, managing partner]
    - level: C-suite
      words: [chief operating, coo, chief commercial, cco, chief financial, cfo, chief marketing,
              cmo, chief, executive director, whole time director, director general, partner]
    - level: Directors
      words: [director, regional director, national director, vice president, vp,
              general manager, country manager]
    - level: Heads and junior directors
      words: [head, assistant director, associate director, deputy director,
              assistant vice president, avp, deputy general manager, dgm,
              assistant general manager, agm, senior manager]
    - level: Managers
      words: [manager]
  # People whose title matches no level above (e.g. Sales Executive, Accountant).
  # true = collect them too, ranked last. false = never collect them.
  include_everyone_else: true
  # When Apollo has nobody usable at an approved company, add the contact address from the company's
  # own website instead, as one contact with the job title "Company inbox (from website)" (agreed
  # 19 Oct 2026). false = the company becomes Missing Info, as before.
  company_inbox_fallback: true
  # Never collect people with these words in their job title.
  exclude_words: [intern, trainee, student, apprentice]
  # Optional Apollo seniority filter for the search. Empty = everyone Apollo holds.
  seniorities: []
  # Inside one seniority level, people with these buying titles come first.
  # Per Channel, best first. The Channel is matched to what was typed into
  # "Add research to the queue" (capital letters do not matter). Any
  # Channel not listed here uses the "default" list. To give a new Channel its
  # own list, copy the default block and rename it, e.g. "Sugar free distributor:".
  titles:
    default:
      - Purchasing Manager
      - Procurement Manager
      - Category Manager
      - Import Manager
      - Business Development Manager
      - Managing Director
      - Founder
    Health food distributor:
      - Purchasing Manager
      - Procurement Manager
      - Category Manager
      - Import Manager
      - Business Development Manager
      - Director
      - Managing Director
      - Founder
    Convenience and impulse distributor:
      - Purchasing Manager
      - Category Manager
      - Business Development Manager
      - Sales Director
      - Managing Director
      - Founder
    Grocery wholesaler:
      - Purchasing Manager
      - Procurement Manager
      - Category Manager
      - Import Manager
      - Buying Director
      - Managing Director
    Pharmacy distributor:
      - Category Manager
      - Procurement Manager
      - Purchasing Manager
      - OTC Manager
      - Business Development Manager
      - Managing Director

assignment:
  # Gives each approved company a salesperson (its HubSpot company owner) when
  # "3 - Find contacts" runs. Contacts get the same owner. Companies that already
  # have an owner keep it. Leave rules and default_owners empty to switch this off.
  #
  # Each rule: market (a country, region or city), optional category, and the
  # salespeople's HubSpot login emails. The most specific matching rule wins.
  # Within a rule, work is shared evenly: the company goes to whoever owns the
  # fewest pipeline companies in that market.
  #
  # Example:
  # rules:
  #   - market: India
  #     owners: [person1@diablosugarfree.com, person2@diablosugarfree.com]
  #   - market: Mumbai, India
  #     category: Pharmacy distributor   # the Channel as typed into the queue; capitals do not matter
  #     owners: [person3@diablosugarfree.com]
  rules: []
  # Used when no rule matches. Empty means those companies stay unassigned.
  default_owners: []

send:
  contacts_per_run: 200
  # Sending mailboxes connected in Instantly (warmed secondary domains only).
  # Example: ["ariel@getdiablo.com", "ariel@diablosnacks.com"]
  # info@diablosnosugar.com added on 18 Oct 2026 (Ariel). Every email to one company (first email,
  # forwards, reminder) goes from the same mailbox; different companies are shared between these.
  # Also add each one to the campaign's "Accounts To Use" in Instantly.
  sending_accounts: [sales@diablosnosugar.com, info@diablosnosugar.com]
  daily_limit: 30
  # Order of emails at each company: ONE loop (agreed 14 Oct 2026). Up to 4 contacts, most senior
  # first, one email every next_contact_after_days days:
  #   Person 1   the introduction (templates.first_email, through the Instantly campaign)
  #   Person 2+  a forward of the latest email in the chain, naming the colleague before them
  #              (templates.forward), sent by Sync from the same mailbox
  #   Person 1   one reminder as a reply in their thread (templates.reminder), at least
  #              min_days_same_person days after their introduction. This is the last email.
  # Persons 2 to 4 get one email each. next_contact_after_days after the last email with no
  # reply, the company becomes Unqualified. Any reply or opt-out stops the company at once.
  # Forwards and the reminder need the GitHub secret INSTANTLY_EMAILS_KEY (scope emails:all).
  next_contact_after_days: 3
  rotation:
    min_days_same_person: 7
    # Instantly forwards an email with our note on top. If the test shows the earlier email is not
    # included underneath, set this to true and Sync adds it itself.
    forward_include_original: false
  # Instantly's own reminder step stays off: Sync sends the forwards and the reminder.
  follow_up:
    enabled: false
    delay_days: 3
  # Privacy notice link shown in every email footer. Check it before sending.
  privacy_url: https://www.diablosugarfree.com/policies/privacy-policy
  # The 2026 catalogue's public web link, opened by the word "here" in the introduction email
  # (final, agreed 14 Oct 2026).
  catalogue_link: https://www.diablosugarfree.com/pages/catalogue-2026
  # Which template files the emails are built from (paths from the repository's top folder).
  # To switch template, change the path here; nothing else needs to change. Set 13 Oct 2026:
  # template_1.json is the earlier first email and template_2.json the team's version (renamed
  # 13 Oct 2026). The first email now uses template_2.json.
  # From 15 Oct 2026 the first email uses template_3.json (Ariel's new introduction: subject
  # "A sugar-free brand with no <country> partner yet", the Outreach company note, a short
  # catalogue link and the booking link in the signature). template_2.json is kept unchanged;
  # to go back, put templates/template_2.json here again.
  templates:
    first_email: templates/template_3.json
    # Persons 2 to 4: forward_2.json from 19 Oct 2026 (Ariel): a short note giving the company note as the
    # reason, then "we believe your company would be the right fit for us". forward.json is kept unchanged.
    forward: templates/forward_2.json
    # Person 1's one reminder: follow_up_2.json from 15 Oct 2026 (Ariel's "Bad Jokes" email, sent as
    # its own email with its own subject). follow_up.json is kept unchanged; put it back here to undo.
    reminder: templates/follow_up_2.json
    follow_up: templates/follow_up.json
    # Company inboxes (19 Oct 2026): when Apollo holds nobody, the contact address on the company's
    # website is emailed instead, greeting "Hello <company> team" and asking them to pass it on.
    # Its own first email (own campaign each month, see company_inbox below) and its own reminder.
    first_email_company_inbox: templates/template_no_info_apollo_1.json
    reminder_company_inbox: templates/follow_up_no_info_apollo_1.json
  company_inbox:
    # The month's company inbox campaign, e.g. "Diablo | OCT2026 | Company inboxes". Created
    # paused by button 4 like the main one; add its mailboxes in Instantly the same way.
    campaign_suffix: Company inboxes
    # At most this many company inbox first emails per sending mailbox a day (agreed 19 Oct 2026);
    # set as that campaign's daily limit (5 x the number of sending mailboxes).
    daily_cap_per_mailbox: 5
  # Booking link for the team's shared booking page. Template 2 shows it on its own line after
  # "Or if you would want to set up a call directly, you can do it from the link below." (agreed
  # 14 Oct 2026). The real Calendly link, set on 14 Oct 2026 (replacing the "xxx" placeholder). If
  # it is ever not a real web address, Send sends nothing and does not change any campaign (it
  # stops with a clear "booking link is missing" message). Template 1 instead adds "You can also
  # book a time directly here: <link>" only when a link is set.
  # Changed on 15 Oct 2026 to the short Calendly link. Template 3 shows it in the signature as
  # "Book a quick meeting with us:", written short (no https:// or www.) but clickable.
  booking_link: "https://calendly.com/outreach-diablo/intro"
  # Signature on every email: the name, the title, then "Diablo Sugar Free" (linked to the website)
  # "(B Healthy Ltd, London)" (agreed 14 Oct 2026). No phone number and no separate website line:
  # the templates no longer show either, so website and phone are not used.
  # Set the same name as each mailbox's sender name in Instantly (Email Accounts), so the
  # inbox shows "Joshua".
  signature:
    name: Joshua
    title: Initial Outreach Team
    website: www.diablosugarfree.com
    phone: ""
    # Signature name from the sending mailbox (provision added 18 Oct 2026, SWITCHED OFF: every
    # email is signed with the name above). To switch it on, set name_from_mailbox to true and fill
    # names_by_mailbox. Then the forwards and the reminder are signed with the name listed for the
    # mailbox that sends them (the same one that sent the first email), and the first email uses
    # Instantly's own first name of its sending mailbox (Email Accounts > the mailbox > sender name),
    # so keep both the same. A mailbox not listed is signed with the name above.
    name_from_mailbox: false
    names_by_mailbox:
      sales@diablosnosugar.com: Joshua
      info@diablosnosugar.com: Joshua
      joshua@diabloexport.com: Joshua
      dana@diabloexport.com: Dana
      elize@diabloexport.com: Elize
  # When Instantly may send. Agreed 7 Oct 2026: any time of day, every day, as soon as a
  # campaign is started (not limited to each country's working hours). Instantly still spaces
  # the emails out and keeps to daily_limit. To limit a market again, add an entry such as:
  #   India: {timezone: Asia/Kolkata, from: "10:00", to: "17:00", days: [mon, tue, wed, thu, fri]}
  # A market can be a country, region or city; "Mumbai, India" uses an India entry unless a
  # "Mumbai" entry exists.
  schedule:
    default:
      timezone: Europe/London
      from: "00:00"
      to: "23:59"
      days: [mon, tue, wed, thu, fri, sat, sun]

# Automatic city list (agreed 12 Oct 2026): keeps research going without anyone adding a market.
# Button 2 ("Automatic run") adds the next city from data/auto_markets.csv (UK, EU, Canada and South America in a
# random order that takes turns between regions) when the research queue is empty. Adding a
# market by hand with button 2 ("Add a market") still works, and those always run first.
auto_markets:
  enabled: false  # switched off on 15 Oct 2026 (Ariel): markets only when someone adds them
  channels: distributors, wholesalers, retailers
  companies_wanted: 30          # per Channel
  max_per_day: 1
  # No city is added while this many companies (or more) wait for review in HubSpot.
  pause_when_awaiting_review: 100
  # Left out until a lawyer has checked the cold email rules there (12 Oct 2026):
  # Canada (CASL), Germany and Austria (consent needed even between businesses).
  # Countries Diablo never looks for leads in are listed separately, for every research
  # job (automatic or added by hand), in data/excluded_countries.txt.
  exclude_countries: [Canada, Germany, Austria]

# Checks on each researched company before it reaches HubSpot (agreed 14 Oct 2026). A company
# whose website no longer exists or is a "domain for sale" page, or where Apollo holds nobody
# with an email, arrives as Missing Info instead of New, so nobody reviews it at gate 1. One that
# also had low confidence in the research is not added at all. Only clear failures count: a
# slow site, or one that blocks automated visitors, passes.
import_checks:
  website: true
  apollo: true                     # free Apollo search; credits are only spent at "find people"
  max_apollo_checks_per_run: 300
  drop_low_confidence_failures: true
  # Nobody in Apollo but a contact address on the company's own website: the company arrives as New
  # (not Missing Info) and that address is emailed (agreed 19 Oct 2026). false = back to Missing Info.
  company_inbox_fallback: true

sync:
  # Only Instantly campaigns whose name starts with this are synced.
  campaign_prefix: "Diablo |"

name: '2f - Timer/Manual - Refresh the "already in HubSpot" list so research skips them'

# Pressed every 3 hours (2, 5, 8 and 11, AM and PM IST) by the outside timer, cron-job.org
# (see docs/outside_timer.md), and can be started by hand.
# Keeps data/known_companies.csv, every company already in HubSpot, so research and the import
# never add one again. Most runs only read the companies added or changed since the last run
# (seconds); Sundays, the first run and a run after switching account read all of them (about
# 2 minutes for the live account's 46,000). Read only: it never changes HubSpot. To use the live
# account, add a repository variable PIPELINE_TARGET = live (Settings > Secrets and variables >
# Actions > Variables).
on:
  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      TARGET: ${{ vars.PIPELINE_TARGET || 'test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Read HubSpot
        env:
          HUBSPOT_TOKEN: ${{ vars.PIPELINE_TARGET == 'live' && secrets.HUBSPOT_TOKEN_LIVE || secrets.HUBSPOT_TOKEN_TEST }}
        run: python -m outreach.known_companies --target "$TARGET" --skip-if-not-configured
      - name: Save the list
        run: |
          bash .github/scripts/save_changes.sh "HubSpot company list" data/known_companies.csv data/known_companies_state.json

name: 'R - Daily summary email'

# Agreed 27 Oct 2026 (Ariel). The partner outreach summary of the day before (India time), sent at
# 9 AM India time to three colleagues from admin@diablosnosugar.com, through Google. Nothing to
# press: cron-job.org starts it every morning (docs/outside_timer.md). Press it yourself with
# "Preview only" ticked to see the email on this page without sending it.
# HubSpot and Instantly are only read; nothing is changed. The recipients and the mailbox's Google
# app password are the GitHub secrets DAILY_REPORT_TO and DAILY_REPORT_APP_PASSWORD.
on:
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only: show the email on this page, send nothing"
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # 1 Nov 2026: the failure email names the steps that failed
    timeout-minutes: 20
    env:
      TARGET: ${{ vars.PIPELINE_TARGET || 'test' }}
      HUBSPOT_TOKEN: ${{ vars.PIPELINE_TARGET == 'live' && secrets.HUBSPOT_TOKEN_LIVE || secrets.HUBSPOT_TOKEN_TEST }}
      INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
      INSTANTLY_ACCOUNTS_KEY: ${{ secrets.INSTANTLY_ACCOUNTS_KEY }}
      DAILY_REPORT_TO: ${{ secrets.DAILY_REPORT_TO }}
      ALERT_TO: ${{ secrets.ALERT_TO }}  # failure emails go only here (3 Nov 2026)
      DAILY_REPORT_APP_PASSWORD: ${{ secrets.DAILY_REPORT_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: "Before: using only code that passed the automatic checks"
        run: bash .github/scripts/use_checked_code.sh
      - name: "On the 25th: rehearse the start of next month (early warning)"
        # 1 Nov 2026 (Ariel): on the 25th, every check is run as if it were the end of this month and the
        # start of the next. If anything would fail, an early warning goes to DAILY_REPORT_TO; the summary
        # email below goes out either way.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$(TZ=Asia/Kolkata date +%d)" != "25" ]; then echo "Only on the 25th."; exit 0; fi
          if bash .github/scripts/date_checks.sh next-month > rehearsal.txt 2>&1; then
            cat rehearsal.txt
          else
            cat rehearsal.txt
            DATE_CHECKS_FAILED="$(sed -n 's/: FAILED$//p' rehearsal.txt | tr '\n' ' ')" python -m outreach.alert --early-warning
          fi
      - name: "The daily summary email"
        run: |
          if [ "${{ inputs.preview }}" = "true" ]; then
            python -m outreach.daily_report --target "$TARGET" --preview
          else
            python -m outreach.daily_report --target "$TARGET"
          fi

      # 3 Nov 2026 (Ariel): to ALERT_TO only (Amodh), the replies of the day before that only named someone else:
      # how many, how many were switched automatically, and the details of those left for a person.
      - name: "Replies that named someone else (to ALERT_TO only)"
        continue-on-error: true
        env:
          INSTANTLY_EMAILS_KEY: ${{ secrets.INSTANTLY_EMAILS_KEY }}
        run: |
          if [ "${{ inputs.preview }}" = "true" ]; then
            python -m outreach.referrals --target "$TARGET" --preview
          else
            python -m outreach.referrals --target "$TARGET"
          fi

      - name: "After: email if this run failed"
        if: failure()
        env:
          DAILY_REPORT_TO: ${{ secrets.DAILY_REPORT_TO }}
          ALERT_TO: ${{ secrets.ALERT_TO }}  # failure emails go only here (3 Nov 2026)
          DAILY_REPORT_APP_PASSWORD: ${{ secrets.DAILY_REPORT_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m outreach.alert --run-failed

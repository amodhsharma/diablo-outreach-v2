name: '2g - Automatic/Manual - Research: add the next city from the automatic list'

# Runs by itself straight after every "2f" run (8 times a day), and can be pressed by hand.
# Adds the next city from data/auto_markets.csv to the research queue, at most one a day, and
# only when nothing is waiting in the queue and fewer than 100 companies wait for review in
# HubSpot (settings: auto_markets in config/settings.yaml). Adding a market by hand with 2a still
# works and always runs first.
on:
  workflow_run:
    workflows: ['2f - Timer/Manual - Refresh the "already in HubSpot" list so research skips them']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TARGET: ${{ vars.PIPELINE_TARGET || 'test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Add the next city if it is time
        env:
          HUBSPOT_TOKEN: ${{ vars.PIPELINE_TARGET == 'live' && secrets.HUBSPOT_TOKEN_LIVE || secrets.HUBSPOT_TOKEN_TEST }}
        run: python -m outreach.auto_markets --target "$TARGET"
      - name: Save the queue
        run: bash .github/scripts/save_changes.sh "Queue: next city from the automatic list" research/queue.csv

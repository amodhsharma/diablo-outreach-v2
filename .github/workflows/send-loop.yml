name: '4 - Send and follow up'

# Button 4: everything that emails people or reacts to their emails (split from button 3 on
# 14 Oct 2026). Nothing to press: cron-job.org starts it every 3 hours (1, 4, 7 and 10, AM and PM
# IST). Press it yourself to run now. The dropdown (26 Oct 2026, Ariel):
#   - "Usual run (results and send)": steps 1 and 2 only (about 13 minutes). Picked to start
#     with, and the timer's runs always do this;
#   - "Run only Health Check": step 3 only, nothing sent or changed (about 13 minutes);
#   - "Run health check in addition to usual flow": steps 1, 2 and 3 (about 26 minutes).
#
# In this order, each step on its own (one failing never stops the others):
#   1. Instantly results to HubSpot: replies, interest, bounces and opt-outs (a reply stops a
#      company before anything else is sent), then each company's loop moves on: the forward to the
#      next person naming the colleague before them, person 1's one reminder, Unqualified at the end.
#   2. Send: person 1's introduction for companies whose people are newly on GATE2.
#   3. Health check: mailboxes, campaigns and why anyone is waiting (diagnostics/instantly_status.md).
#
# Testing only: type CONFIRM in "TEST ONLY" and the gaps between emails (3 days between people at a
# company, 7 days before person 1's reminder) become 15 minutes for that run. It is refused for the
# live account, and the automatic runs always use the normal gaps.
#
# Before: the automatic tests. After: the report is saved, and the run fails (GitHub emails you) if
# any step failed. Only records with Lead Source AUTO-OUTREACH are ever changed.
on:
  workflow_dispatch:
    inputs:
      run:
        description: "What to run"
        type: choice
        options:
          - "Usual run (results and send)"
          - "Run only Health Check"
          - "Run health check in addition to usual flow"
        default: "Usual run (results and send)"
      test_gaps:
        description: "TEST ONLY: type CONFIRM for 15-minute gaps instead of 3 and 7 days, this run only (refused on live). Leave empty normally"
        default: ""

concurrency:
  group: outreach-writes
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TARGET: ${{ vars.PIPELINE_TARGET || 'test' }}
      # full = steps 1 and 2 (also when nothing is chosen, as in the timer's runs); check = step 3 only;
      # full_check = steps 1, 2 and 3.
      MODE: ${{ inputs.run == 'Run only Health Check' && 'check' || inputs.run == 'Run health check in addition to usual flow' && 'full_check' || 'full' }}
      TEST_GAPS: ${{ inputs.test_gaps }}
      HUBSPOT_TOKEN: ${{ vars.PIPELINE_TARGET == 'live' && secrets.HUBSPOT_TOKEN_LIVE || secrets.HUBSPOT_TOKEN_TEST }}
      INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: "Before: up to date and tests pass"
        run: |
          git pull --rebase
          python -m pytest -q

      - name: "Before: test gaps (only when CONFIRM is typed, never on live)"
        if: env.TEST_GAPS != ''
        run: |
          if [ "$TEST_GAPS" != "CONFIRM" ]; then
            echo "::error::Test gaps: type CONFIRM exactly (in capitals), or leave the box empty. Nothing was done."; exit 1; fi
          if [ "$TARGET" != "test" ]; then
            echo "::error::Test gaps are refused for the live HubSpot account. Nothing was done."; exit 1; fi
          echo "TEST GAPS ON: 15 minutes instead of 3 and 7 days, for this run only (test account)."

      - name: "1. Instantly results to HubSpot, then each company's loop: forward, reminder, Unqualified"
        id: sync
        if: env.MODE == 'full' || env.MODE == 'full_check'
        continue-on-error: true
        env:
          INSTANTLY_EMAILS_KEY: ${{ secrets.INSTANTLY_EMAILS_KEY }}
          INSTANTLY_BLOCKLIST_KEY: ${{ secrets.INSTANTLY_BLOCKLIST_KEY }}
          # 27 Oct 2026: real replies forwarded to this address from admin@diablosnosugar.com
          REPLY_FORWARD_TO: ${{ secrets.REPLY_FORWARD_TO }}
          DAILY_REPORT_APP_PASSWORD: ${{ secrets.DAILY_REPORT_APP_PASSWORD }}
        run: python -m outreach.sync --target "$TARGET" --skip-if-not-configured --test-gaps "$TEST_GAPS"

      - name: "2. Send person 1's introduction (GATE2 people at new companies)"
        id: send
        if: env.MODE == 'full' || env.MODE == 'full_check'
        continue-on-error: true
        run: python -m outreach.send --target "$TARGET" --skip-if-not-configured --test-gaps "$TEST_GAPS"

      - name: "3. Health check: mailboxes, campaigns, who is waiting and why"
        id: health
        if: env.MODE == 'check' || env.MODE == 'full_check'
        continue-on-error: true
        env:
          INSTANTLY_ACCOUNTS_KEY: ${{ secrets.INSTANTLY_ACCOUNTS_KEY }}
          INSTANTLY_EMAILS_KEY: ${{ secrets.INSTANTLY_EMAILS_KEY }}
          INSTANTLY_BLOCKLIST_KEY: ${{ secrets.INSTANTLY_BLOCKLIST_KEY }}
        run: python -m outreach.check_instantly

      - name: "After: save the report"
        if: always()
        run: |
          bash .github/scripts/save_changes.sh "Send and follow up ($MODE)" diagnostics/instantly_status.md \
            diagnostics/sync_last_run.md data/timeline_notes.json data/daily_log.json data/forwarded_replies.json

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: send-run
          path: runs/
          if-no-files-found: ignore

      - name: "After: did every step work?"
        if: always()
        run: |
          failed=""
          [ "${{ steps.sync.outcome }}" = "failure" ] && failed="$failed 1 (Instantly results and the loop);"
          [ "${{ steps.send.outcome }}" = "failure" ] && failed="$failed 2 (send);"
          [ "${{ steps.health.outcome }}" = "failure" ] && failed="$failed 3 (health check);"
          # 20 Oct 2026: emails still went out, but nobody should miss that opt-outs could not be checked.
          [ -f runs/blocklist_unreadable ] && failed="$failed Instantly's blocklist could not be read (emails still went out; add or check the secret INSTANTLY_BLOCKLIST_KEY);"
          if [ -n "$failed" ]; then echo "::error::These steps failed:$failed open them above for the reason."; exit 1; fi
          echo "Every step worked."

name: 'T - Bond paragraph preview (Instantly)'

# Agreed 26 Oct 2026. Creates "TEST | Bond paragraph preview (delete me)" in Instantly: never
# launched, with the month's email as it will look with the bond paragraph, and three made-up
# example contacts (example.com addresses nobody can receive). Open it in Instantly, Sequences,
# Preview, "Load data for lead", and pick each example: the sports shop shows the bold heading and
# its line; the two distributors show the usual email with no gap. "Send test email" sends one to
# your own address. Nothing in HubSpot and none of the Diablo campaigns is touched.
# Choose "delete" to remove the preview campaign (button 4 also deletes it by itself later).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "create the preview campaign, or delete it"
        type: choice
        options: [create, delete]
        default: create

concurrency:
  group: outreach-writes
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: "Before: tests pass"
        run: python -m pytest -q
      - name: "The preview campaign"
        run: python -m outreach.bond_preview --action "${{ inputs.action }}"

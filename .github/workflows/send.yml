name: 4b. Send to Instantly

# Adds contacts set to Approved to send (gate 2) to Instantly campaigns.
# Runs by itself every 2 hours (agreed 7 Oct 2026), and can still be pressed by hand.
# With nobody approved it stops in seconds. A new Location and Channel gets a new
# campaign, created paused: press Start on it in Instantly once. Contacts added to a
# campaign that is already running are emailed by themselves.
# The scheduled run uses the account in the repository variable PIPELINE_TARGET (test if not set).
on:
  schedule:
    - cron: "47 */2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Which HubSpot account"
        type: choice
        options: [test, live]
        default: test
      dry_run:
        description: "Dry run (show the plan, send nothing)"
        type: boolean
        default: true

concurrency: send

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ inputs.target || vars.PIPELINE_TARGET || 'test' }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          HUBSPOT_TOKEN: ${{ (inputs.target || vars.PIPELINE_TARGET) == 'live' && secrets.HUBSPOT_TOKEN_LIVE || secrets.HUBSPOT_TOKEN_TEST }}
        run: |
          ARGS="--target $TARGET"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m outreach.send $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: send-plan
          path: runs/
          if-no-files-found: ignore

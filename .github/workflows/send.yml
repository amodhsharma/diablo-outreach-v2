name: 4b. Send to Instantly

# Adds contacts set to Approved to send (gate 2) to Instantly campaigns.
# Pressed every 3 hours (12, 3, 6 and 9, AM and PM IST) by the outside timer, cron-job.org,
# and can still be pressed by hand.
# With nobody approved it stops in seconds. Each month gets one new campaign for every
# Location and Channel, created paused: press Start on it in Instantly once a month.
# Contacts added to a campaign that is already running are emailed by themselves.
# The timer's run uses the account in the repository variable PIPELINE_TARGET (test if not set).
# GitHub's own timer was switched off on 8 Oct 2026 because it skipped runs; see
# docs/outside_timer.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which HubSpot account (auto = the repository variable PIPELINE_TARGET, else test)"
        type: choice
        options: [auto, test, live]
        default: auto
      dry_run:
        description: "Dry run (show the plan, send nothing)"
        type: boolean
        default: true

concurrency: send

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: ${{ (inputs.target != '' && inputs.target != 'auto') && inputs.target || vars.PIPELINE_TARGET || 'test' }}
      DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Send
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          HUBSPOT_TOKEN: ${{ ((inputs.target != '' && inputs.target != 'auto') && inputs.target || vars.PIPELINE_TARGET) == 'live' && secrets.HUBSPOT_TOKEN_LIVE || secrets.HUBSPOT_TOKEN_TEST }}
        run: |
          ARGS="--target $TARGET"
          if [ "$DRY_RUN" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python -m outreach.send $ARGS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: send-plan
          path: runs/
          if-no-files-found: ignore

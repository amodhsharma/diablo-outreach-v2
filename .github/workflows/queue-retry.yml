name: "2c - Research queue: retry a failed job"

# Puts a Failed job (or one Channel of it) back to Waiting.
# The job ID is the first column of research/queue.csv (e.g. J0003).
on:
  workflow_dispatch:
    inputs:
      job:
        description: "Job ID, e.g. J0003"
        required: true
      channel:
        description: "Only this Channel (leave empty for every Channel in the job)"
        default: ""

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retry
        env:
          JOB: ${{ inputs.job }}
          CHANNEL: ${{ inputs.channel }}
          BY: ${{ github.actor }}
        run: python -m outreach.research_queue retry --job "$JOB" --channel "$CHANNEL" --by "$BY"
      - name: Save the queue
        env:
          JOB: ${{ inputs.job }}
        run: |
          bash .github/scripts/save_changes.sh "Queue: retry $JOB" research/queue.csv

name: '1 - Setup HubSpot (once per account)'

# Press once for each HubSpot account (your test space, then live), first with "Dry run" ticked:
# it lists exactly what it would add and changes nothing. Then press again with it unticked.
#
# Before: the automatic tests and a check that the key belongs to the account you chose.
# Main: adds the two contact fields (Outreach personal line, Outreach order) and the Lead Status
#       choices the pipeline needs. In a test account it also creates Lead Source and Industry
#       Type to match live. In live it adds only the two fields and the three agreed choices.
# After: reads every company already in that account, so research never adds one again.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which HubSpot account"
        type: choice
        options: [test, live]
        default: test
      dry_run:
        description: "Dry run: list what would be added, change nothing"
        type: boolean
        default: true

concurrency:
  group: research-writes
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      HUBSPOT_TOKEN: ${{ inputs.target == 'live' && secrets.HUBSPOT_TOKEN_LIVE || secrets.HUBSPOT_TOKEN_TEST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: "Before: tests pass"
        run: python -m pytest -q
      - name: "Add the fields and Lead Status choices"
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.target }}" = "live" ]; then ARGS="$ARGS --allow-production"; fi
          python -m outreach.setup_hubspot $ARGS
      - name: "After: read every company already in this account"
        if: inputs.dry_run == false || inputs.dry_run == 'false'
        run: |
          python -m outreach.known_companies --target "${{ inputs.target }}" --full
          bash .github/scripts/save_changes.sh "Setup: list of companies already in HubSpot" \
            data/known_companies.csv data/known_companies_state.json

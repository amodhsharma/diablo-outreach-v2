name: '5 - Timer - Update HubSpot with who was emailed, replied or bounced, and line up the next person'

# Pressed every 3 hours (1, 4, 7 and 10, AM and PM IST) by the outside timer, cron-job.org
# (see docs/outside_timer.md), and can be started by hand.
# It quietly skips until the HubSpot and Instantly keys are added.
# To sync the live account, add a repository variable PIPELINE_TARGET = live
# (Settings > Secrets and variables > Actions > Variables).
on:
  workflow_dispatch:

concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET: ${{ vars.PIPELINE_TARGET || 'test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Sync
        env:
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          HUBSPOT_TOKEN: ${{ vars.PIPELINE_TARGET == 'live' && secrets.HUBSPOT_TOKEN_LIVE || secrets.HUBSPOT_TOKEN_TEST }}
        run: python -m outreach.sync --target "$TARGET" --skip-if-not-configured

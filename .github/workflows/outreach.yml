name: '3 - Find contacts'

# Button 3 prepares people and never emails anyone (split from sending on 14 Oct 2026; sending is
# button 4). Nothing to press: cron-job.org starts it every 3 hours (12, 3, 6 and 9, AM and PM IST).
# Press it yourself only to run now.
#
# In this order, each step on its own (one failing never stops the others):
#   1. Find people: Apollo finds the top 4 people at companies on GATE1 with no contacts yet
#      (credits only for approved companies, within the per-run limit in config/settings.yaml).
#   2. Put Claude's personal lines into HubSpot ("New, Personal line filled").
#   3. Update the list of people Claude still has to write personal lines for (Claude writes them
#      28 minutes later).
# Also runs by itself the moment Claude saves personal lines, for step 2 only.
#
# "Check only" (kept so the timer's request still fits): writes the health report and changes
# nothing. Before: the automatic tests. After: the lists are saved, and the run fails (GitHub
# emails you) if any step failed. Only records with Lead Source AUTO-OUTREACH are ever changed.
on:
  push:
    branches: [main]
    paths:
      - "mail/lines/*/*.json"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Check only: the health report, nothing changed"
        type: boolean
        default: false

concurrency:
  group: outreach-writes
  cancel-in-progress: false

jobs:
  contacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TARGET: ${{ vars.PIPELINE_TARGET || 'test' }}
      MODE: ${{ github.event_name == 'push' && 'lines' || (inputs.check_only == true || inputs.check_only == 'true') && 'check' || 'full' }}
      HUBSPOT_TOKEN: ${{ vars.PIPELINE_TARGET == 'live' && secrets.HUBSPOT_TOKEN_LIVE || secrets.HUBSPOT_TOKEN_TEST }}
      INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: "Before: up to date and tests pass"
        run: |
          git pull --rebase
          python -m pytest -q

      - name: "1. Find people at GATE1 companies (Apollo)"
        id: people
        if: env.MODE == 'full'
        continue-on-error: true
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: python -m outreach.find_contacts --target "$TARGET" --skip-if-not-configured

      - name: "2. Put Claude's personal lines into HubSpot"
        id: lines
        if: env.MODE == 'full' || env.MODE == 'lines'
        continue-on-error: true
        run: python -m outreach.import_lines --target "$TARGET" --skip-if-not-configured

      - name: "3. Update the list of people still needing a personal line"
        id: pending
        if: env.MODE == 'full'
        continue-on-error: true
        # Also lists the people step 1 has just added, by their ID: HubSpot's search can take a
        # minute to show new records (so button 3 no longer needs pressing twice, 15 Oct 2026).
        run: python -m outreach.export_for_lines --target "$TARGET" --skip-if-not-configured --new-contacts runs/new_contacts.json

      - name: "Check only: health report"
        id: health
        if: env.MODE == 'check'
        continue-on-error: true
        env:
          INSTANTLY_ACCOUNTS_KEY: ${{ secrets.INSTANTLY_ACCOUNTS_KEY }}
          INSTANTLY_EMAILS_KEY: ${{ secrets.INSTANTLY_EMAILS_KEY }}
        run: python -m outreach.check_instantly

      - name: "After: save the lists"
        if: always()
        run: |
          bash .github/scripts/save_changes.sh "Find contacts ($MODE)" mail/pending.json mail/imported.txt \
            data/apollo_skipped.json data/apollo_kept.json diagnostics/instantly_status.md

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: find-contacts-run
          path: runs/
          if-no-files-found: ignore

      - name: "After: did every step work?"
        if: always()
        run: |
          failed=""
          [ "${{ steps.people.outcome }}" = "failure" ] && failed="$failed 1 (find people);"
          [ "${{ steps.lines.outcome }}" = "failure" ] && failed="$failed 2 (personal lines);"
          [ "${{ steps.pending.outcome }}" = "failure" ] && failed="$failed 3 (list for Claude);"
          [ "${{ steps.health.outcome }}" = "failure" ] && failed="$failed health check;"
          if [ -n "$failed" ]; then echo "::error::These steps failed:$failed open them above for the reason."; exit 1; fi
          echo "Every step worked."

name: '3 - Outreach'

# One button for everything after gate 1 (agreed 14 Oct 2026). Replaces 3, 4a, 4b, 4c, 5 and 6.
#
# Nothing to press: cron-job.org starts it every 3 hours. Press it yourself only to run now, or tick
# "Check only" for the health report without changing or sending anything.
#
# Every 3 hours, in this order, each step on its own (one failing never stops the others):
#   1. Instantly results to HubSpot: replies, interest, bounces and opt-outs (a reply stops a
#      company before anything else is sent), then the next person in line and rounds 2 and 3.
#   2. Find people: Apollo finds the top 4 people at companies on GATE1 with no contacts yet
#      (credits only for approved companies, within the per-run limit in config/settings.yaml).
#   3. Put Claude's personal lines into HubSpot ("New, Personal line filled").
#   4. Send: GATE2 people go to Instantly, one person per company at a time.
#   5. Health check: mailboxes, campaigns and why anyone is waiting (diagnostics/instantly_status.md).
#   6. Update the list of people Claude still has to write personal lines for.
# Also runs by itself the moment Claude saves personal lines, for step 3 only.
#
# Before: the automatic tests. After: the lists are saved, and the run fails (GitHub emails you) if
# any step failed. Only records with Lead Source AUTO-OUTREACH are ever changed.
on:
  push:
    branches: [main]
    paths:
      - "mail/lines/*/*.json"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Check only: the health report, nothing sent or changed"
        type: boolean
        default: false

concurrency:
  group: outreach-writes
  cancel-in-progress: false

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      TARGET: ${{ vars.PIPELINE_TARGET || 'test' }}
      MODE: ${{ github.event_name == 'push' && 'lines' || (inputs.check_only == true || inputs.check_only == 'true') && 'check' || 'full' }}
      HUBSPOT_TOKEN: ${{ vars.PIPELINE_TARGET == 'live' && secrets.HUBSPOT_TOKEN_LIVE || secrets.HUBSPOT_TOKEN_TEST }}
      INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: "Before: up to date and tests pass"
        run: |
          git pull --rebase
          python -m pytest -q

      - name: "1. Instantly results to HubSpot, next person in line, rounds 2 and 3"
        id: sync
        if: env.MODE == 'full'
        continue-on-error: true
        env:
          INSTANTLY_EMAILS_KEY: ${{ secrets.INSTANTLY_EMAILS_KEY }}
        run: python -m outreach.sync --target "$TARGET" --skip-if-not-configured

      - name: "2. Find people at GATE1 companies (Apollo)"
        id: people
        if: env.MODE == 'full'
        continue-on-error: true
        env:
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
        run: python -m outreach.find_contacts --target "$TARGET" --skip-if-not-configured

      - name: "3. Put Claude's personal lines into HubSpot"
        id: lines
        if: env.MODE == 'full' || env.MODE == 'lines'
        continue-on-error: true
        run: python -m outreach.import_lines --target "$TARGET" --skip-if-not-configured

      - name: "4. Send GATE2 people to Instantly"
        id: send
        if: env.MODE == 'full'
        continue-on-error: true
        run: python -m outreach.send --target "$TARGET" --skip-if-not-configured

      - name: "5. Health check: mailboxes, campaigns, who is waiting and why"
        id: health
        if: env.MODE == 'full' || env.MODE == 'check'
        continue-on-error: true
        env:
          INSTANTLY_ACCOUNTS_KEY: ${{ secrets.INSTANTLY_ACCOUNTS_KEY }}
          INSTANTLY_EMAILS_KEY: ${{ secrets.INSTANTLY_EMAILS_KEY }}
        run: python -m outreach.check_instantly

      - name: "6. Update the list of people still needing a personal line"
        id: pending
        if: env.MODE == 'full'
        continue-on-error: true
        run: python -m outreach.export_for_lines --target "$TARGET" --skip-if-not-configured

      - name: "After: save the lists"
        if: always()
        run: |
          bash .github/scripts/save_changes.sh "Outreach run ($MODE)" mail/pending.json mail/imported.txt \
            data/apollo_skipped.json data/apollo_kept.json diagnostics/instantly_status.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: outreach-run
          path: runs/
          if-no-files-found: ignore

      - name: "After: did every step work?"
        if: always()
        run: |
          failed=""
          [ "${{ steps.sync.outcome }}" = "failure" ] && failed="$failed 1 (Instantly results);"
          [ "${{ steps.people.outcome }}" = "failure" ] && failed="$failed 2 (find people);"
          [ "${{ steps.lines.outcome }}" = "failure" ] && failed="$failed 3 (personal lines);"
          [ "${{ steps.send.outcome }}" = "failure" ] && failed="$failed 4 (send);"
          [ "${{ steps.health.outcome }}" = "failure" ] && failed="$failed 5 (health check);"
          [ "${{ steps.pending.outcome }}" = "failure" ] && failed="$failed 6 (list for Claude);"
          if [ -n "$failed" ]; then echo "::error::These steps failed:$failed open them above for the reason."; exit 1; fi
          echo "Every step worked."
